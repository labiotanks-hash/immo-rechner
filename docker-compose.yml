# A²O Immo-Rechner auf einem kleinen Server (Hetzner CX23: 2 vCPU, 4 GB RAM).
# Einrichten: deploy/einrichten.sh (legt .env an, startet alles).
# Von außen erreichbar ist nur Caddy (80/443); App, Bridge und Whisper nur intern.
services:
  app:
    build:
      context: .
      args:
        STAND: ${STAND:-}
    restart: unless-stopped
    env_file: .env
    environment:
      WA_STORE: /wa
      AUFTRAG_DIR: /auftrag
      TRANSCRIBE_URL: ${TRANSCRIBE_URL:-http://whisper:9000/v1/audio/transcriptions}
    volumes:
      - daten:/daten
      - wa:/wa
      # „Nach Updates suchen“: Auftrag an den Server (deploy/aktualisieren.sh über systemd)
      - ${UPDATE_ORDNER:-/opt/immo-rechner/auftrag}:/auftrag
      # Optional: eure echte FixFlip Pro (index.html + standalone/build.py) — in .env FIXFLIP_DIR=/fixflip-pro
      # - ./fixflip-pro:/fixflip-pro:ro
    expose: ["8080"]
    mem_limit: 1500m
    depends_on: [bridge]

  # Liest die WhatsApp-Gruppe(n) aus WA_GRUPPEN als verknüpftes Gerät der Firmennummer mit
  bridge:
    build: ./bridge
    restart: unless-stopped
    environment:
      WA_GRUPPEN: ${WA_GRUPPEN:-Objekte Immo}
    volumes:
      - wa:/store
    mem_limit: 300m

  # Lokale Spracherkennung (faster-whisper large-v3-turbo, int8)
  whisper:
    build: ./whisper
    restart: unless-stopped
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-large-v3-turbo}
      WHISPER_THREADS: "2"
    volumes:
      - whisper_modelle:/modelle
    expose: ["9000"]
    mem_limit: 2500m
    cpus: 1.8

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]

volumes:
  daten:
  wa:
  whisper_modelle:
  caddy_data:
  caddy_config:

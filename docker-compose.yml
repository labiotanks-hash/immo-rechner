# Auf einem kleinen Server (z. B. Hetzner CX22) mit Docker:
#   cp .env.example .env   # ausfüllen
#   docker compose up -d --build
# Caddy holt das HTTPS-Zertifikat für DOMAIN automatisch (DNS muss vorher auf den Server zeigen).
services:
  ankauf:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - daten:/daten
      # Optional: eure echte FixFlip Pro (index.html + standalone/build.py) — dann rechnet und
      # baut die App exakt mit euren Dateien. In .env zusätzlich FIXFLIP_DIR=/fixflip-pro setzen.
      # - ./fixflip-pro:/fixflip-pro:ro
    expose:
      - "8080"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - ankauf

volumes:
  daten:
  caddy_data:
